# 主帮助配置
helpCfg:
  # 基本配置
  title: "三角洲行动 帮助"
  subTitle: "DeltaForce-Plugin HELP"
  
  # 样式主题配置
  themeName: "default" # 主题名称，对应 resources/help/imgs/ 下的文件夹名称（如 default、dark、light 等）
  
  # 布局配置
  colWidth: 420        # 列宽度（像素）
  colCount: 2          # 列数
  twoColumnLayout: true # 是否使用两列大表格布局（左右各一个表格）
  bgBlur: true         # 是否启用背景模糊效果

# 主帮助列表
helpList:
  # 配置说明：
  # - fullWidth: 跨两列显示的组（用于标题等），按 order 排序
  # - left: 左列显示的组，按 order 排序
  # - right: 右列显示的组，按 order 排序
  # - order: 序号，用于排序（数字越小越靠前）
  # - masterOnly: true - 仅主人可见
  fullWidth:
    - order: 1
      group: "命令触发符使用 AstrBot WebUI 的默认配置，例如 帮助"
    - order: 2
      group: "此为基础菜单，其他功能请使用 娱乐帮助 查看娱乐菜单"
    - order: 100
      group: "系统管理（仅主人）"
      masterOnly: true # 仅主人可见
      list:
        - icon: 61
          title: "广播开启 | 广播关闭"
          desc: "开启/关闭广播通知接收"
        - icon: 78
          title: "广播状态"
          desc: "查看广播通知设置状态"
